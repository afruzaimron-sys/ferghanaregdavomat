<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Farg'ona VMMTB Davomat</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>(function(){if(localStorage.getItem('theme')==='light'){document.documentElement.classList.add('light-mode');}})();</script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Ambient Glowing Background Effect */
        .ambient-glow-1 {
            position: absolute;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.45) 0%, rgba(6, 182, 212, 0.15) 50%, transparent 70%);
            filter: blur(80px);
            animation: pulseGlow1 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -150px;
            right: -150px;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(99, 102, 241, 0.2) 50%, transparent 70%);
            filter: blur(90px);
            animation: pulseGlow2 10s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow-3 {
            position: absolute;
            top: 40%;
            right: 25%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
            filter: blur(60px);
            animation: pulseGlow1 12s ease-in-out infinite alternate-reverse;
            pointer-events: none;
            z-index: 1;
        }

        .pattern-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30 Z M30 8 L52 30 L30 52 L8 30 Z M30 18 L42 30 L30 42 L18 30 Z' fill='none' stroke='%2338bdf8' stroke-width='0.6' stroke-opacity='0.12'/%3E%3Ccircle cx='30' cy='30' r='5' fill='none' stroke='%23818cf8' stroke-width='0.5' stroke-opacity='0.15'/%3E%3C/svg%3E");
            background-size: 44px 44px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes pulseGlow1 {
            0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
            100% { transform: scale(1.25) translate(40px, 30px); opacity: 0.95; }
        }

        @keyframes pulseGlow2 {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(-30px, -40px); opacity: 0.9; }
        }

        /* Glassmorphic Login Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 36px 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 30px rgba(79, 70, 229, 0.2);
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.7), 0 0 45px rgba(79, 70, 229, 0.3);
        }

        .card-top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .nav-back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-back-link:hover {
            color: #ffffff;
        }

        .card-lang-group {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .lang-tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-tab-btn:hover {
            color: #ffffff;
        }

        .lang-tab-btn.active {
            background: #4f46e5;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
        }

        .brand-section {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-avatar {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 0.86rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s;
            z-index: 2;
        }

        .login-input {
            width: 100%;
            padding: 12px 48px 12px 40px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff !important;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        .login-input:focus {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .login-input:focus ~ .input-icon-left {
            color: #818cf8;
        }

        /* Prevent browser autofill yellow background */
        .login-input:-webkit-autofill,
        .login-input:-webkit-autofill:hover, 
        .login-input:-webkit-autofill:focus, 
        .login-input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Disable Microsoft Edge & IE native password reveal icon that intercepts clicks */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear,
        input::-ms-reveal,
        input::-ms-clear {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none !important;
        }

        /* Password Eye Toggle Button - High Z-Index & Click Area */
        .password-eye-btn {
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 38px !important;
            height: 38px !important;
            background: transparent !important;
            border: none !important;
            color: #94a3b8 !important;
            font-size: 18px !important;
            cursor: pointer !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: color 0.2s, transform 0.2s !important;
            z-index: 100 !important;
            pointer-events: auto !important;
        }

        .password-eye-btn:hover {
            color: #38bdf8 !important;
            transform: translateY(-50%) scale(1.1) !important;
        }

        .password-eye-btn:active {
            transform: translateY(-50%) scale(0.95) !important;
        }

        .login-submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
        }

        .login-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #4338ca, #2563eb);
        }

        .login-submit-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-alert {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .login-hint-box {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.76rem;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <!-- Ambient Glow Blobs -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>
    <div class="pattern-overlay"></div>

    <div class="login-card">
        <!-- Top Nav -->
        <div class="card-top-nav">
            <a href="index.html" class="nav-back-link">
                <i class="fas fa-arrow-left"></i> <span id="lblBack">Bosh sahifa</span>
            </a>
            <!-- 3 Languages Switcher -->
            <div class="card-lang-group">
                <button type="button" onclick="setLoginLang('uz')" class="lang-tab-btn" id="l_uz">O‘zb</button>
                <button type="button" onclick="setLoginLang('oz')" class="lang-tab-btn" id="l_oz">Ўзб</button>
                <button type="button" onclick="setLoginLang('ru')" class="lang-tab-btn" id="l_ru">Рус</button>
            </div>
        </div>

        <!-- Brand Section -->
        <div class="brand-section">
            <div class="brand-avatar">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2 class="brand-title" id="lblTitle">Tizimga Kirish</h2>
            <p class="brand-sub" id="lblSub">Farg'ona VMMTB Davomat Nazorati</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="input-group">
                <label class="input-label" id="lblUsername">Login / Foydalanuvchi nomi</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon-left"></i>
                    <input type="text" id="username" class="login-input" placeholder="Loginni kiriting" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" id="lblPassword">Parol</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon-left"></i>
                    <input type="password" id="password" class="login-input" placeholder="Parolni kiriting" required autocomplete="current-password">
                    <button type="button" class="password-eye-btn" id="toggleEyeBtn" onmousedown="event.preventDefault()" onclick="togglePasswordVisibility(event)" title="Parolni ko'rsatish/yashirish" aria-label="Parolni ko'rsatish">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div id="activeSessionBox" style="display:none; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.35); border-radius:12px; padding:12px 16px; margin-bottom:16px;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                    <div>
                        <div style="font-size:0.75rem; color:#94a3b8; font-weight:600;" id="lblSessionStatus">Hozirda tizimga kirilgan:</div>
                        <div style="font-weight:700; color:#38bdf8; font-size:0.95rem; display:flex; align-items:center; gap:6px; margin-top:2px;">
                            <i class="fas fa-user-shield"></i> <span id="activeUserName">MRQIROL</span>
                        </div>
                    </div>
                    <a href="admin.html" id="btnGoAdmin" class="btn" style="background:linear-gradient(135deg, #0284c7, #2563eb); color:#fff; padding:7px 15px; border-radius:10px; font-size:0.82rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(2,132,199,0.35);">
                        <i class="fas fa-sliders"></i> <span id="lblGoAdmin">Admin Panelga o'tish</span>
                    </a>
                </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:-4px; margin-bottom:16px; font-size:0.85rem; color:var(--text-muted);">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;">
                    <input type="checkbox" id="rememberMe" checked style="accent-color:#38bdf8; width:16px; height:16px; cursor:pointer;">
                    <span id="lblRemember">Login va parolni eslab qolish</span>
                </label>
            </div>

            <div id="loginAlert" class="login-alert">
                <i class="fas fa-exclamation-circle"></i> <span id="loginAlertText">Login yoki parol xato!</span>
            </div>

            <button type="submit" class="login-submit-btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> <span id="lblBtn">Kirish</span>
            </button>
        </form>

        <div class="login-hint-box">
            <span>&copy; 2026 Farg'ona VMMTB &bull; UZINFOCOM nazoratida</span>
        </div>
    </div>

    <script>
        // Password Visibility Toggle with Eye Icon (Edge, Chrome, Firefox supported)
        function togglePasswordVisibility(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (!pwdInput) return;

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                if (eyeIcon) {
                    eyeIcon.className = 'fas fa-eye-slash';
                    eyeIcon.style.color = '#38bdf8';
                }
            } else {
                pwdInput.type = 'password';
                if (eyeIcon) {
                    eyeIcon.className = 'fas fa-eye';
                    eyeIcon.style.color = '#94a3b8';
                }
            }
            pwdInput.focus();
        }
        window.togglePasswordVisibility = togglePasswordVisibility;

        document.addEventListener('DOMContentLoaded', () => {
            const eyeBtn = document.getElementById('toggleEyeBtn');
            if (eyeBtn) {
                eyeBtn.addEventListener('click', togglePasswordVisibility);
            }

            // Restore saved credentials
            const savedU = localStorage.getItem('saved_login_username') || localStorage.getItem('dashboard_username') || '';
            const savedP = localStorage.getItem('saved_login_password') || '';
            if (savedU) {
                const uInp = document.getElementById('username');
                if (uInp) uInp.value = savedU;
            }
            if (savedP) {
                const pInp = document.getElementById('password');
                if (pInp) pInp.value = savedP;
            }

            // Check if already authenticated and show quick link to Admin
            const curTok = localStorage.getItem('dashboard_token') || localStorage.getItem('token');
            const curUsr = localStorage.getItem('dashboard_username') || '';
            if (curTok && curUsr) {
                const sessBox = document.getElementById('activeSessionBox');
                const sessName = document.getElementById('activeUserName');
                if (sessBox && sessName) {
                    sessName.textContent = curUsr.toUpperCase();
                    sessBox.style.display = 'block';
                }
            }
        });

        // 3-Language i18n Dictionary
        const loginI18n = {
            uz: {
                back: "Bosh sahifa",
                title: "Tizimga Kirish",
                sub: "Farg'ona VMMTB Davomat Nazorati",
                uLabel: "Login / Foydalanuvchi nomi",
                pLabel: "Parol",
                uPh: "Loginni kiriting",
                pPh: "Parolni kiriting",
                btn: "Kirish",
                remember: "Login va parolni eslab qolish",
                sessStatus: "Hozirda tizimga kirilgan:",
                goAdmin: "Admin Panelga o'tish",
                loading: "Tekshirilmoqda...",
                err: "Login yoki parol noto'g'ri!",
                errNet: "Tarmoq xatoligi! Qaytadan urinib ko'ring."
            },
            oz: {
                back: "Бош саҳифа",
                title: "Тизимга Кириш",
                sub: "Фарғона ВММТБ Давомат Назорати",
                uLabel: "Логин / Фойдаланувчи номи",
                pLabel: "Парол",
                uPh: "Логинни киритинг",
                pPh: "Паролни киритинг",
                btn: "Кириш",
                remember: "Логин ва паролни эслаб қолиш",
                sessStatus: "Ҳозирда тизимга кирилган:",
                goAdmin: "Админ Панелга ўтиш",
                loading: "Текширилмоқда...",
                err: "Логин ёки парол нотўғри!",
                errNet: "Тармоқ хатолиги! Қайтадан уриниб кўринг."
            },
            ru: {
                back: "Главная страница",
                title: "Вход в систему",
                sub: "Контроль посещаемости Ферганского УДОШО",
                uLabel: "Логин / Имя пользователя",
                pLabel: "Пароль",
                uPh: "Введите логин",
                pPh: "Введите пароль",
                btn: "Войти",
                remember: "Запомнить логин и пароль",
                sessStatus: "Вход уже выполнен:",
                goAdmin: "Перейти в Панель Админа",
                loading: "Проверка...",
                err: "Неверный логин или пароль!",
                errNet: "Сетевая ошибка! Попробуйте снова."
            }
        };

        function setLoginLang(lang) {
            localStorage.setItem('lang', lang);
            document.querySelectorAll('.lang-tab-btn').forEach(b => b.classList.remove('active'));
            const targetBtn = document.getElementById('l_' + lang);
            if (targetBtn) targetBtn.classList.add('active');

            const d = loginI18n[lang] || loginI18n.uz;
            document.getElementById('lblBack').textContent = d.back;
            document.getElementById('lblTitle').textContent = d.title;
            document.getElementById('lblSub').textContent = d.sub;
            document.getElementById('lblUsername').textContent = d.uLabel;
            document.getElementById('lblPassword').textContent = d.pLabel;
            document.getElementById('username').placeholder = d.uPh;
            document.getElementById('password').placeholder = d.pPh;
            document.getElementById('lblBtn').textContent = d.btn;
            const rEl = document.getElementById('lblRemember');
            if (rEl && d.remember) rEl.textContent = d.remember;
            const sEl = document.getElementById('lblSessionStatus');
            if (sEl && d.sessStatus) sEl.textContent = d.sessStatus;
            const gEl = document.getElementById('lblGoAdmin');
            if (gEl && d.goAdmin) gEl.textContent = d.goAdmin;
        }

        // Initialize language
        const currentLang = localStorage.getItem('lang') || 'uz';
        setLoginLang(currentLang);

        // Fallback Known Credentials
        const KNOWN_USERS = {
            'mrqirol': { passes: ['2323'], role: 'superadmin', fio: 'Super Admin', district: null, school: 'Boshqarma' },
            'abror': { passes: ['1234'], role: 'admin', fio: 'Abror (Bosh Admin)', district: null, school: 'Boshqarma' },
            'mmtb': { passes: ['1234'], role: 'admin', fio: 'MMTB (Bosh Admin)', district: null, school: 'Boshqarma' },
            'admin': { passes: ['1234', '2323'], role: 'admin', fio: 'Administrator', district: null, school: 'Boshqarma' }
        };

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const username = usernameInput.toLowerCase();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');
            const submitBtn = document.getElementById('submitBtn');
            const d = loginI18n[localStorage.getItem('lang') || 'uz'] || loginI18n.uz;

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${d.loading}</span>`;

            let loginSuccess = false;
            let authData = null;

            // 1. Try backend API first
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password })
                });

                if (res.ok) {
                    authData = await res.json();
                    loginSuccess = true;
                }
            } catch (err) {
                console.warn('API fetch failed, falling back to local credentials...', err);
            }

            // 2. Fallback check for known accounts
            if (!loginSuccess) {
                const userConfig = KNOWN_USERS[username] || KNOWN_USERS[usernameInput];
                if (userConfig && userConfig.passes.includes(password)) {
                    authData = {
                        token: 'admin_master_' + Date.now(),
                        role: userConfig.role || 'admin',
                        username: usernameInput,
                        district: userConfig.district || null,
                        school: userConfig.school || 'Boshqarma',
                        fio: userConfig.fio || 'Administrator',
                        phone: '+998901234567',
                        must_change_password: false
                    };
                    loginSuccess = true;
                }
            }

            if (loginSuccess && authData) {
                // Ensure proper roles
                if (username === 'mrqirol' || authData.role === 'superadmin') {
                    authData.role = 'superadmin';
                } else if (username === 'abror' || username === 'mmtb' || authData.role === 'admin') {
                    authData.role = 'admin';
                }

                // If password change is required for district users
                if (authData.must_change_password) {
                    localStorage.setItem('must_change_password', 'true');
                } else {
                    localStorage.removeItem('must_change_password');
                }

                // Remember credentials if checked
                const remMe = document.getElementById('rememberMe');
                if (remMe && remMe.checked) {
                    localStorage.setItem('saved_login_username', usernameInput);
                    localStorage.setItem('saved_login_password', password);
                    localStorage.setItem('remember_me', 'true');
                } else {
                    localStorage.removeItem('saved_login_username');
                    localStorage.removeItem('saved_login_password');
                    localStorage.setItem('remember_me', 'false');
                }

                saveAuthSession(authData);

                const isAdmin = (authData.role === 'superadmin' || authData.role === 'admin' || username === 'mrqirol' || username === 'abror' || username === 'mmtb');
                window.location.replace(isAdmin ? 'admin.html' : 'dashboard.html');
                return;
            }

            // Authentication Failed
            alertText.textContent = d.err;
            alertBox.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> <span>${d.btn}</span>`;
        }

        function saveAuthSession(data) {
            const tok = data.token || 'superadmin-master-key';
            const rol = data.role || 'superadmin';
            const usr = data.username || 'mrqirol';
            localStorage.setItem('dashboard_token', tok);
            localStorage.setItem('token', tok);
            localStorage.setItem('dashboard_role', rol);
            localStorage.setItem('dashboard_username', usr);
            localStorage.setItem('dashboard_district', data.district || 'Viloyat');
            localStorage.setItem('dashboard_school', data.school || 'Boshqarma');
            localStorage.setItem('dashboard_fio', data.fio || usr || 'Administrator');
            localStorage.setItem('dashboard_phone', data.phone || '');
            sessionStorage.setItem('dashboard_token', tok);
            sessionStorage.setItem('dashboard_role', rol);
            sessionStorage.setItem('dashboard_username', usr);
            if (data.assigned_schools) {
                localStorage.setItem('dashboard_assigned_schools', JSON.stringify(data.assigned_schools));
            }
        }
    </script>
    <script src="promo-widget.js"></script>
</body>
